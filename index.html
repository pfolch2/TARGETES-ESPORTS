
<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordenem les síl·labes dels esports</title>

  <style>
    :root {
      --fons: #f4f6f8;
      --text: #17202a;
      --blau: #175cd3;
      --verd: #16794b;
      --vermell: #b42318;
      --vora: #c8d0d9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--fons);
      color: var(--text);
      text-align: center;
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      margin: 0 0 10px;
    }

    .instruccions {
      font-size: 1.15rem;
      margin: 0 auto 24px;
      max-width: 720px;
      line-height: 1.5;
    }

    .targetes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 22px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .targeta-contenidor {
      perspective: 1000px;
    }

    .targeta {
      position: relative;
      width: 100%;
      min-height: 360px;
      border: 3px solid var(--vora);
      border-radius: 18px;
      background: white;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.55s;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }

    .targeta.girada {
      transform: rotateY(180deg);
    }

    .cara {
      position: absolute;
      inset: 0;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 15px;
    }

    .davant { background: #fff; }

    .darrere {
      transform: rotateY(180deg);
      background: #fff;
    }

    .icona-esport {
      font-size: 7rem;
      line-height: 1.3;
    }

    .nom-esport {
      font-size: 1.4rem;
      font-weight: bold;
    }

    .pista {
      font-size: 1rem;
      color: #475467;
    }

    .sillabes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      min-height: 58px;
    }

    .sil·laba {
      border: 2px solid #98a2b3;
      border-radius: 10px;
      background: #f8fafc;
      padding: 12px 15px;
      min-width: 58px;
      font-size: 1.25rem;
      font-weight: bold;
      cursor: pointer;
      color: var(--text);
    }

    .sil·laba:focus-visible,
    button:focus-visible,
    .targeta:focus-visible {
      outline: 4px solid #fdb022;
      outline-offset: 3px;
    }

    .sil·laba.seleccionada {
      background: #dbeafe;
      border-color: var(--blau);
    }

    .resposta {
      min-height: 44px;
      width: 100%;
      padding: 10px;
      border: 2px dashed #98a2b3;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .botons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    button.accio {
      border: 0;
      border-radius: 10px;
      padding: 12px 17px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .corregir {
      background: var(--blau);
      color: white;
    }

    .esborrar {
      background: #e4e7ec;
      color: #17202a;
    }

    .missatge {
      min-height: 28px;
      font-size: 1.05rem;
      font-weight: bold;
    }

    .correcte { color: var(--verd); }
    .incorrecte { color: var(--vermell); }

    .nota {
      margin-top: 22px;
      color: #475467;
      font-size: .95rem;
    }

    @media (max-width: 520px) {
      body { padding: 14px; }
      .targeta { min-height: 340px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .targeta { transition: none; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

  <h1>ORDENEM LES SÍL·LABES DELS ESPORTS!</h1>

  <p class="instruccions">
    1. Gira una targeta per veure les síl·labes.<br>
    2. Prem les síl·labes en l’ordre correcte per formar el nom de l’esport.<br>
    3. Prem <strong>CORREGIR</strong> per comprovar la resposta.
  </p>

  <main class="targetes" id="targetes"></main>

  <p class="nota">
    <div style="margin: 30px auto;">
    <button id="descarregarPDF" class="accio corregir">
        DESCARREGAR RESULTATS EN PDF
    </button>
</div>
    Consell: si t’equivoques, prem «TORNAR A COMENÇAR» i prova-ho de nou.
  </p>

  <script>

    // LLISTA DELS 50 ESPORTS

    const esports = [

      {
        nom: "FUT-BOL",
        sillabes: ["FUT", "BOL"],
        icona: "⚽",
        alt: "Futbol"
      },
      {
        nom: "BAS-QUET",
        sillabes: ["BAS", "QUET"],
        icona: "🏀",
        alt: "Bàsquet"
      },
      {
        nom: "TE-NIS",
        sillabes: ["TEN", "NIS"],
        icona: "🎾",
        alt: "Tennis"
      },
      {
        nom: "NA-TA-CIÓ",
        sillabes: ["NA", "TA", "CIÓ"],
        icona: "🏊",
        alt: "Natació"
      },
      {
        nom: "CI-CLIS-ME",
        sillabes: ["CI", "CLIS", "ME"],
        icona: "🚴",
        alt: "Ciclisme"
      },
      {
        nom: "GIM-NÀS-TI-CA",
        sillabes: ["GIM", "NÀS", "TI", "CA"],
        icona: "🤸",
        alt: "Gimnàstica"
      },
      {
        nom: "VO-LEI-BOL",
        sillabes: ["VO", "LEI", "BOL"],
        icona: "🏐",
        alt: "Voleibol"
      },
      {
        nom: "HAND-BOL",
        sillabes: ["HAND", "BOL"],
        icona: "🤾",
        alt: "Handbol"
      },
      {
        nom: "HO-QUEI",
        sillabes: ["HO", "QUEI"],
        icona: "🏒",
        alt: "Hoquei"
      },
      {
        nom: "PA-TI-NAT-GE",
        sillabes: ["PA", "TI", "NAT", "GE"],
        icona: "⛸️",
        alt: "Patinatge"
      },
      {
        nom: "AT-LE-TIS-ME",
        sillabes: ["AT", "LE", "TIS", "ME"],
        icona: "🏃",
        alt: "Atletisme"
      },
      {
        nom: "ES-CA-LA-DA",
        sillabes: ["ES", "CA", "LA", "DA"],
        icona: "🧗",
        alt: "Escalada"
      },
      {
        nom: "ES-GRI-MA",
        sillabes: ["ES", "GRI", "MA"],
        icona: "🤺",
        alt: "Esgrima"
      },
      {
        nom: "BO-XA",
        sillabes: ["BO", "XA"],
        icona: "🥊",
        alt: "Boxa"
      },
      {
        nom: "KA-RA-TE",
        sillabes: ["KA", "RA", "TE"],
        icona: "🥋",
        alt: "Karate"
      },
      {
        nom: "JU-DO",
        sillabes: ["JU", "DO"],
        icona: "🥋",
        alt: "Judo"
      },
      {
        nom: "BÀD-MIN-TON",
        sillabes: ["BÀD", "MIN", "TON"],
        icona: "🏸",
        alt: "Bàdminton"
      },
      {
        nom: "PING-PONG",
        sillabes: ["PING", "PONG"],
        icona: "🏓",
        alt: "Ping-pong"
      },
      {
        nom: "ES-QUÍ",
        sillabes: ["ES", "QUÍ"],
        icona: "🎿",
        alt: "Esquí"
      },
      {
        nom: "SNOW-BOARD",
        sillabes: ["SNOW", "BOARD"],
        icona: "🏂",
        alt: "Snowboard"
      },
      {
        nom: "PI-RA-GÜIS-ME",
        sillabes: ["PI", "RA", "GÜIS", "ME"],
        icona: "🛶",
        alt: "Piragüisme"
      },
      {
        nom: "VE-LA",
        sillabes: ["VE", "LA"],
        icona: "⛵",
        alt: "Vela"
      },
      {
        nom: "PES-CA",
        sillabes: ["PES", "CA"],
        icona: "🎣",
        alt: "Pesca"
      },
      {
        nom: "BEIS-BOL",
        sillabes: ["BEIS", "BOL"],
        icona: "⚾",
        alt: "Beisbol"
      },
      {
        nom: "RUG-BI",
        sillabes: ["RUG", "BI"],
        icona: "🏉",
        alt: "Rugbi"
      },
      {
        nom: "LLUI-TA",
        sillabes: ["LLUI", "TA"],
        icona: "🤼",
        alt: "Lluita"
      },
      {
        nom: "I-O-GA",
        sillabes: ["I", "O", "GA"],
        icona: "🧘",
        alt: "Ioga"
      },
      {
        nom: "DAN-SA",
        sillabes: ["DAN", "SA"],
        icona: "💃",
        alt: "Dansa"
      },
      {
        nom: "HÍ-PI-CA",
        sillabes: ["HÍ", "PI", "CA"],
        icona: "🐎",
        alt: "Hípica"
      },
      {
        nom: "BO-LOS",
        sillabes: ["BO", "LOS"],
        icona: "🎳",
        alt: "Bolos"
      },
      {
        nom: "BI-LLAR",
        sillabes: ["BI", "LLAR"],
        icona: "🎱",
        alt: "Billar"
      },
      {
        nom: "ES-CACS",
        sillabes: ["ES", "CACS"],
        icona: "♟️",
        alt: "Escacs"
      }

    ];

    // BARREJA LES SÍL·LABES

    function barreja(llista) {
      const copia = [...llista];

      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }

      if (copia.length > 1 && copia.every((s, i) => s === llista[i])) {
        copia.push(copia.shift());
      }

      return copia;
    }

    const contenidor = document.getElementById("targetes");
    // REGISTRE DELS RESULTATS DE CADA ESPORT

      const resultats = esports.map(esport => ({
          nom: esport.alt,
          resposta: "",
          estat: "PENDENT"
      }));

    // CREA LES TARGETES

    esports.forEach((esport, index) => {

      const correcte = esport.sillabes.join("");
      const desordenades = barreja(esport.sillabes);

      const envoltori = document.createElement("section");
      envoltori.className = "targeta-contenidor";

      envoltori.innerHTML = `
        <div class="targeta" tabindex="0" role="button"
             aria-label="Gira la targeta de l'esport ${esport.alt}"
             aria-pressed="false">

          <div class="cara davant">
            <div class="icona-esport" aria-hidden="true">${esport.icona}</div>
            <div class="nom-esport">QUIN ESPORT ÉS?</div>
            <div class="pista">Prem la targeta per girar-la</div>
          </div>

          <div class="cara darrere">
            <div class="nom-esport">ORDENA LES SÍL·LABES</div>
            <div class="sillabes"></div>
            <div class="resposta"></div>

            <div class="botons">
              <button class="accio corregir" type="button">CORREGIR</button>
              <button class="accio esborrar" type="button">TORNAR A COMENÇAR</button>
            </div>

            <div class="missatge" aria-live="polite"></div>
          </div>
        </div>
      `;

      const targeta = envoltori.querySelector(".targeta");
      const zonaSillabes = envoltori.querySelector(".sillabes");
      const resposta = envoltori.querySelector(".resposta");
      const missatge = envoltori.querySelector(".missatge");

      let triades = [];

      function actualitzaResposta() {
        resposta.textContent = triades.map(s => s.text).join(" · ");
      }

      function pintaSillabes() {
        zonaSillabes.innerHTML = "";

        desordenades.forEach((sillaba, i) => {
          const boto = document.createElement("button");

          boto.type = "button";
          boto.className = "sil·laba";
          boto.textContent = sillaba;

          boto.addEventListener("click", (event) => {
            event.stopPropagation();

            if (boto.disabled) return;

            triades.push({ text: sillaba, id: i });

            boto.disabled = true;
            boto.classList.add("seleccionada");

            actualitzaResposta();

            missatge.textContent = "";
            missatge.className = "missatge";
          });

          zonaSillabes.appendChild(boto);
        });
      }

      function reinicia() {
        triades = [];
        actualitzaResposta();

        missatge.textContent = "";
        missatge.className = "missatge";

    // REINICIEM TAMBÉ EL RESULTAT D'AQUEST ESPORT
        resultats[index].resposta = "";
        resultats[index].estat = "PENDENT";

        pintaSillabes();
    }

      // GIRAR LA TARGETA

      targeta.addEventListener("click", (event) => {
        if (event.target.closest("button")) return;

        targeta.classList.toggle("girada");

        targeta.setAttribute(
          "aria-pressed",
          targeta.classList.contains("girada") ? "true" : "false"
        );
      });

      targeta.addEventListener("keydown", (event) => {
        if (
          (event.key === "Enter" || event.key === " ") &&
          !event.target.closest("button")
        ) {
          event.preventDefault();
          targeta.classList.toggle("girada");
        }
      });

      // CORREGIR LA RESPOSTA

      envoltori.querySelector(".corregir").addEventListener("click", (event) => {
          event.stopPropagation();

          const respostaUsuari = triades.map(s => s.text).join("");

          // GUARDEM LA RESPOSTA DE L'ALUMNE
          resultats[index].resposta = triades.map(s => s.text).join("-");

          if (respostaUsuari === correcte) {
              missatge.textContent = "MOLT BÉ! RESPOSTA CORRECTA!";
              missatge.className = "missatge correcte";

              resultats[index].estat = "CORRECTE";

          } else {
              missatge.textContent = "ENCARA NO. TORNA-HO A PROVAR!";
              missatge.className = "missatge incorrecte";

              resultats[index].estat = "INCORRECTE";
          }
      });

      // TORNAR A COMENÇAR

      envoltori.querySelector(".esborrar").addEventListener("click", (event) => {
        event.stopPropagation();
        reinicia();
      });

      pintaSillabes();
      contenidor.appendChild(envoltori);

    });

  // DESCARREGAR ELS RESULTATS EN PDF

document.getElementById("descarregarPDF").addEventListener("click", () => {

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    // COMPTEM ELS RESULTATS
    const correctes = resultats.filter(r => r.estat === "CORRECTE").length;
    const incorrectes = resultats.filter(r => r.estat === "INCORRECTE").length;
    const pendents = resultats.filter(r => r.estat === "PENDENT").length;

    let y = 20;

    // TÍTOL
    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("RESULTATS DE L'ACTIVITAT", 15, y);

    y += 12;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(12);
    doc.text("Ordenem les síl·labes dels esports", 15, y);

    y += 10;

    doc.text("Data: " + new Date().toLocaleDateString("ca-ES"), 15, y);

    y += 10;

    doc.text("Nom de l'alumne/a: __________________________", 15, y);

    y += 15;

    // RESUM
    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.text("RESUM DELS RESULTATS", 15, y);

    y += 10;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);

    doc.text("Respostes correctes: " + correctes, 15, y);
    y += 7;

    doc.text("Respostes incorrectes: " + incorrectes, 15, y);
    y += 7;

    doc.text("Activitats pendents: " + pendents, 15, y);

    y += 15;

    // RESULTATS DE CADA ESPORT
    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.text("RESULTATS DE CADA ESPORT", 15, y);

    y += 10;

    resultats.forEach((r, index) => {

        // SI NO HI HA ESPAI, CREEM UNA PÀGINA NOVA
        if (y > 270) {
            doc.addPage();
            y = 20;
        }

        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);

        doc.text((index + 1) + ". " + r.nom, 15, y);

        y += 7;

        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);

        const resposta = r.resposta || "Sense resposta";

        doc.text("Resposta: " + resposta, 20, y);

        y += 6;

        doc.text("Resultat: " + r.estat, 20, y);

        y += 10;
    });

    // DESCARREGUEM EL DOCUMENT
    doc.save("resultats_esports.pdf");

});
  </script>

</body>
</html>
